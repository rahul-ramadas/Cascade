name: Prepare a .NET runner
description: >
  Gets a runner ready to build Cascade: the SDK global.json asks for, and nothing else.

  DELIBERATELY NO CACHING. actions/cache looked obvious and MEASURED as a bad trade twice over. The
  packages are thousands of small files and SAVING them cost 66-106s in the post step of every job -
  which counts, because a job is not finished until its post steps are, and whatever waits on it does not
  start. Restoring the 60MB coverage collector from a cache instead of installing it was a wash: 21s of a
  100s job either way. The collector is now fetched ALONGSIDE the build, where four idle cores and a
  network wait overlap for nothing, and each build restores its own project graph.

runs:
  using: composite
  steps:
    # Installing an SDK costs ~45s, almost all of it extracting a 300MB archive, and the runner image
    # normally already has the one global.json asks for. Delegate the decision to dotnet itself so the
    # probe obeys global.json and its roll-forward rules rather than comparing version strings by hand.
    - name: Check whether the SDK global.json asks for is already here
      id: sdk
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $resolved = & dotnet --version 2>&1
        $code = if ($LASTEXITCODE -is [int]) { $LASTEXITCODE } else { 1 }
        $found = $code -eq 0
        Write-Host $(if ($found) { "SDK $resolved is already installed." } else { "setup-dotnet must install it: $resolved" })
        "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        exit 0

    - uses: actions/setup-dotnet@v6
      if: steps.sdk.outputs.found != 'True'
      with:
        global-json-file: global.json

