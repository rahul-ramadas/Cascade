name: CI

# Everything that can reach the binary or the tests triggers a run. Only files that cannot are ignored,
# and a run is skipped just when every file a push touches is one of them. That deliberately keeps
# .editorconfig (it decides which analyzer rules are errors, and warnings are errors here),
# Directory.Build.props, global.json, Cascade.slnx (SolutionTests asserts on it), scripts/ and this
# workflow itself triggering CI. Use "Run workflow" on the Actions tab to force a run regardless.
# The two lists must stay identical; GitHub Actions does not support YAML anchors.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE
      - docs/**
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE
      - docs/**
      - .gitignore
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless, but never cancel a master run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

  # Signing switches itself off wherever it cannot work, so no fork has to care that it exists: a fork has
  # no signing variables, and the federated credential in Entra trusts only this repository on master, so a
  # token minted anywhere else buys nothing. A fork therefore gets an unsigned exe and a green build.
  # Restricting it to master also means "Run workflow" on master signs without releasing - the release job
  # wants a push - which is the way to rehearse a change to any of this before it is load-bearing.
  SIGN_RELEASE: ${{ vars.SIGNING_ACCOUNT_NAME != '' && github.ref == 'refs/heads/master' }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    # id-token is what Azure login exchanges for signing credentials. A permission cannot be granted per
    # step, so pull request runs are handed the same token; it is inert, because the federated credential
    # accepts only master and a pull request's token says otherwise.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # Installing an SDK costs ~45s, almost all of it extracting a 300MB archive. Delegate SDK
      # resolution to dotnet itself so the probe obeys global.json and its roll-forward rules.
      - name: Check whether global.json SDK is already available
        id: sdk
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Resolving the SDK requested by global.json from $env:GITHUB_WORKSPACE."
          $resolvedSdk = & dotnet --version 2>&1
          $exitCode = if ($LASTEXITCODE -is [int]) { $LASTEXITCODE } else { 1 }

          if ($exitCode -eq 0) {
            $found = $true
            Write-Host "global.json SDK is already available."
            Write-Host "Resolved SDK: $resolvedSdk"
          } else {
            $found = $false
            Write-Host "global.json SDK is not available yet; setup-dotnet must install it."
            Write-Host "dotnet --version exit code: $exitCode"
            $resolvedSdk | ForEach-Object { Write-Host $_ }
          }

          Write-Host "global.json SDK preinstalled: $found"
          "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.found != 'True'
        with:
          global-json-file: global.json

      - name: Record .NET SDK used
        run: |
          $resolvedSdk = dotnet --version
          Write-Host "dotnet --version (SDK resolved through global.json): $resolvedSdk"

          Write-Host "dotnet --list-sdks:"
          $sdkList = dotnet --list-sdks
          $sdkList | ForEach-Object { Write-Host $_ }

          Write-Host "dotnet msbuild -version:"
          $msbuildVersion = dotnet msbuild -version
          $msbuildVersion | ForEach-Object { Write-Host $_ }

          @(
            '### .NET SDK used by CI'
            ''
            '| Item | Value |'
            '| --- | --- |'
            "| SDK resolved by global.json | ``$resolvedSdk`` |"
            "| MSBuild version | ``$(($msbuildVersion | Where-Object { $_ } | Select-Object -Last 1))`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # CalVer: <year>.<month>.<run number>. Always increasing, never needs bumping by hand.
      # The offset carries the numbering past v2026.8.59, the last release made before the repository was
      # recreated to drop a rewritten history - that reset GITHUB_RUN_NUMBER to 1, and a version lower than
      # one already released would read as a downgrade to the updater and never install.
      - name: Compute version
        id: version
        run: |
          $now = [datetime]::UtcNow
          $version = "$($now.Year).$($now.Month).$([int]$env:GITHUB_RUN_NUMBER + 60)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore Cascade.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Cascade.slnx -c Release --no-restore -p:Version=$env:VERSION

      # One self-contained-looking file: the runtime is still shared (framework-dependent), but the app's
      # own assemblies and config are bundled into the exe so it can be copied around on its own.
      # DebugType=embedded keeps line numbers in the crash log without a .pdb sitting next to it.
      # Published before the tests so they can run against the exe that actually ships.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/Cascade.App/Cascade.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -p:Version=$env:VERSION
          -o artifacts/publish

      - name: Verify publish stayed framework-dependent
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\Cascade.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published executable was not found at $exe."
          }

          $thresholdBytes = 5MB
          $actualBytes = (Get-Item -LiteralPath $exe).Length
          Write-Host "Published Cascade.exe size: $actualBytes bytes (threshold: $thresholdBytes bytes)."

          if ($actualBytes -gt $thresholdBytes) {
            throw "Published Cascade.exe is $actualBytes bytes, over the 5 MB guardrail. The likely cause is the publish becoming self-contained: framework-dependent single-file output is around 1 MB and grows slowly with the code, while self-contained output is about 116 MB."
          }

      # Authenticode signing. SmartScreen accrues reputation to the signing certificate, not to each new
      # file hash, so a signed release inherits the standing of every release before it - where an unsigned
      # build, being a brand new hash on every push to master, always starts again from nothing.
      # Signed here rather than just before packaging so the tests below drive the bytes that ship: a
      # signature changes the file, and an exe tested before signing is not the exe anybody downloads.
      - name: Azure login
        if: env.SIGN_RELEASE == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: env.SIGN_RELEASE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\artifacts\publish\Cascade.exe
          file-digest: SHA256
          # Certificates now expire within 460 days, and a signature without a countersigned timestamp dies
          # with the certificate that made it - retroactively, taking every release already downloaded with
          # it. The timestamp is what proves the signing happened while the certificate was still valid.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cascade
          description-url: https://github.com/rahul-ramadas/Cascade

      # The signing step reports its own failures, but not a signature that applied and then does not hold
      # up - an untrusted chain, or the silent timestamp omission above. Windows is the authority on that,
      # so ask it here rather than discover it from a user's SmartScreen prompt.
      - name: Verify the signature
        if: env.SIGN_RELEASE == 'true'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\Cascade.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe

          if ($signature.Status -ne 'Valid') {
            throw "Cascade.exe did not come out validly signed. Status: $($signature.Status). $($signature.StatusMessage)"
          }

          if (-not $signature.TimeStamperCertificate) {
            throw "Cascade.exe is signed but not timestamped, so every signature made with this certificate stops verifying the day it expires. Check the timestamp-rfc3161 input on the signing step."
          }

          $signer = $signature.SignerCertificate
          Write-Host "Signer: $($signer.Subject)"
          Write-Host "Issuer: $($signer.Issuer)"
          Write-Host "Certificate valid until: $($signer.NotAfter.ToString('u'))"
          Write-Host "Timestamped by: $($signature.TimeStamperCertificate.Subject)"

          @(
            '### Authenticode signature'
            ''
            '| Item | Value |'
            '| --- | --- |'
            "| Status | ``$($signature.Status)`` |"
            "| Signer | ``$($signer.Subject)`` |"
            "| Certificate expires | ``$($signer.NotAfter.ToString('u'))`` |"
            "| Timestamped | ``yes`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Core tests
        run: >
          dotnet test tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core.trx"
          --results-directory artifacts/test-results

      # Run against the PUBLISHED exe, not the build output in bin/. The published bundle resolves its
      # assemblies and embedded resources differently, and it is what users get, so testing the other
      # layout as well only bought faster blame attribution - not coverage - for another ~80s.
      # CASCADE_TEST_EXE redirects TestData.AppExe(), which every UI test launches.
      # These drive the real Cascade.exe through UI Automation, so they need the runner's desktop
      # session. Capped so a hung window cannot burn the whole job's time budget.
      - name: UI tests (published exe)
        timeout-minutes: 15
        env:
          CASCADE_TEST_EXE: ${{ github.workspace }}\artifacts\publish\Cascade.exe
        run: >
          dotnet test tests/Cascade.UiTests/Cascade.UiTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=ui.trx"
          --results-directory artifacts/test-results

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Copy-Item artifacts/publish/Cascade.exe artifacts/package/Cascade.exe

      - uses: actions/upload-artifact@v7
        with:
          name: cascade-win-x64
          path: artifacts/package/*.exe
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    # Only a green build of master ships; pull requests and manual runs stop at the artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cascade-win-x64
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The asset keeps a fixed name so that
        # https://github.com/<owner>/<repo>/releases/latest/download/Cascade.exe always fetches the newest
        # build - that URL needs the exact filename, so a version in it means no fixed download command can
        # ever exist. The version is in the tag, the release title, and the executable's own metadata.
        run: |
          gh release create "v$VERSION" dist/Cascade.exe \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Cascade v$VERSION" \
            --generate-notes

      # Every green push to master ships a release, so the release list and the tag namespace grow without
      # bound - 33 had piled up before the first sweep. Keeping the newest few leaves room to roll back to a
      # recent known-good exe without hoarding builds nobody would install any more.
      # Ordering is by publish time, not created_at: GitHub reports the target commit's own timestamp as a
      # release's created_at, so a rewritten history or an out-of-order commit date would scramble that sort
      # and prune the wrong builds.
      # A release and its tag are separate objects, and deleting the release alone would strand the tag,
      # so --cleanup-tag takes both. Drafts are skipped because a draft has no tag to clean up.
      # Failure here is deliberately fatal: the release itself is already published by this point, and a red
      # run is the only thing that would surface pruning silently breaking and letting releases pile up.
      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: 5
        run: |
          stale=$(gh release list --repo "$REPO" --limit 200 \
            --json tagName,publishedAt,isDraft \
            --jq "[.[] | select(.isDraft | not)] | sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName")

          if [ -z "$stale" ]; then
            echo "Nothing to prune: $KEEP or fewer releases exist."
            exit 0
          fi

          while read -r tag; do
            echo "Deleting release $tag and its tag."
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done <<< "$stale"
