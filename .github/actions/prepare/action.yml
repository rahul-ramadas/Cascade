name: Prepare a .NET runner
description: >
  Gets a runner ready to build Cascade: the SDK global.json asks for, the packages it needs, and the
  coverage collector - all taken from the cache when the dependencies have not changed. Every job here
  starts with it, so the work is written once rather than a dozen times.

inputs:
  coverage:
    description: Also make dotnet-coverage available.
    default: 'false'
  coverage-version:
    description: Which version of it, pinned so a new release cannot move the coverage number.
    default: 18.11.0

runs:
  using: composite
  steps:
    # Installing an SDK costs ~45s, almost all of it extracting a 300MB archive, and the runner image
    # normally already has the one global.json asks for. Delegate the decision to dotnet itself so the
    # probe obeys global.json and its roll-forward rules rather than comparing version strings by hand.
    - name: Check whether the SDK global.json asks for is already here
      id: sdk
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $resolved = & dotnet --version 2>&1
        $code = if ($LASTEXITCODE -is [int]) { $LASTEXITCODE } else { 1 }
        $found = $code -eq 0
        Write-Host $(if ($found) { "SDK $resolved is already installed." } else { "setup-dotnet must install it: $resolved" })
        "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        exit 0

    - uses: actions/setup-dotnet@v6
      if: steps.sdk.outputs.found != 'True'
      with:
        global-json-file: global.json

    # Restoring from cache takes a few seconds where fetching all of this costs twenty, and a dozen jobs
    # pay it. Keyed on the files that decide what is restored, so a new package reference misses the cache
    # rather than silently restoring the old set.
    - uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.dotnet/tools
        key: nuget-${{ runner.os }}-${{ inputs.coverage-version }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-${{ inputs.coverage-version }}-

    - name: Restore
      shell: pwsh
      run: dotnet restore Cascade.slnx

    # Guarded rather than run unconditionally: install refuses outright when the tool is already there,
    # which it is whenever the cache hit.
    - name: The coverage collector
      if: inputs.coverage == 'true'
      shell: pwsh
      run: |
        if (Get-Command dotnet-coverage -ErrorAction SilentlyContinue) { Write-Host 'dotnet-coverage came from the cache.'; exit 0 }
        dotnet tool install --global dotnet-coverage --version ${{ inputs.coverage-version }}
