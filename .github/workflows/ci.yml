name: CI

# Everything that can reach the binary or the tests triggers a run. Only files that cannot are ignored,
# and a run is skipped just when every file a push touches is one of them. That deliberately keeps
# .editorconfig (it decides which analyzer rules are errors, and warnings are errors here),
# Directory.Build.props, global.json, Cascade.slnx (SolutionTests asserts on it), scripts/ and this
# workflow itself triggering CI. Use "Run workflow" on the Actions tab to force a run regardless.
# The two lists must stay identical; GitHub Actions does not support YAML anchors.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE
      - docs/**
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - LICENSE
      - docs/**
      - .gitignore
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless, but never cancel a master run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

# WHY THIS IS SHAPED THE WAY IT IS. The pipeline used to be one job doing everything in a line, and took
# six and a half minutes: 73s of it a build, 233s of it three suites waiting for each other. Neither order
# was necessary. It is now a fan of jobs that hold each other up only where one really needs what another
# produced:
#
#   tools ─────────────────────────────────────┐    keeps the coverage collector's cache filled
#   strict x5 ─────────────────────────────────┤    every analyzer and code style rule, one project each
#   package ───────────────────────────────────┤    publish, sign, and open the bundle that ships
#   core x2 ┐                                  │
#   app  x4 ├── gate (coverage floor + tallies)┴── release
#   ui   x6 ┘
#
# The suites are split across runners rather than run one after another, which is what a desktop-bound
# suite needs: they cannot share a desktop, but they can have one each. scripts/Split-Tests.ps1 works out
# each shard from what is really in the assembly, so a test added tomorrow lands in one without anybody
# remembering to put it there, and the gate proves the shards between them ran all of it - a filter that
# quietly selected half the tests would otherwise be a green run.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

  # Analyzers, code style and the package audit decide nothing about the bytes a build produces: MEASURED
  # on a runner, a solution build takes 73s with them and 20s without, for identical output. So the jobs
  # that only want binaries build without them and `strict` runs every one of them beside the tests
  # instead of in front of them. Nothing is skipped - it is moved off the critical path.
  # The audit stays on everywhere: it happens during restore, its findings are warnings rather than
  # errors by design, and turning it off here would leave the strict pass below - which does not restore
  # from scratch - the only place it could run, where it might quietly not.
  FAST_BUILD: -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false

  # Wrapped round every suite rather than using the test SDK's own collector, because the UI suite drives
  # the app as a separate process and that one will not follow a child - which is why a third of the app's
  # code once read as untested. tests/coverage.runsettings records the rest. Pinned so a new release cannot
  # move the number on an unrelated push.
  COVERAGE_TOOL_VERSION: 18.11.0

jobs:
  # Fills the cache the test jobs restore the coverage collector from. Nothing waits on it - it is here so
  # that the save, which runs in a job's post step and holds it open, never lands on a job anybody needs.
  tools:
    name: Keep the collector warm
    runs-on: windows-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.dotnet/tools
          key: dotnet-coverage-${{ runner.os }}-${{ env.COVERAGE_TOOL_VERSION }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-coverage --version ${{ env.COVERAGE_TOOL_VERSION }}

  # The quality gate. It produces nothing anybody uses; it exists so that every analyzer diagnostic, code
  # style rule and package advisory is still an error, without the other twelve jobs each paying 53
  # seconds to be told the same thing.
  #
  # One project per runner, because analysing them one after another is what made this the longest job in
  # the pipeline at a minute and a half. Each job builds its project's references WITHOUT the rules -
  # whichever job owns a project is the one that analyses it, so every project is still analysed exactly
  # once - and then builds the project itself with everything on.
  # MUTATION-TESTED, because the failure to fear here is silence: a violation the first pass accepts does
  # fail the second, so the second really recompiles rather than finding the output already up to date.
  strict:
    name: Rules (${{ matrix.project }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Cascade.Core/Cascade.Core.csproj
          - src/Cascade.App/Cascade.App.csproj
          - tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj
          - tests/Cascade.AppTests/Cascade.AppTests.csproj
          - tests/Cascade.UiTests/Cascade.UiTests.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: dotnet build ${{ matrix.project }} -c Release -v q --nologo ${{ env.FAST_BUILD }}
      - run: dotnet build ${{ matrix.project }} -c Release -v q --nologo -p:BuildProjectReferences=false

  # The exe that ships, and the only checks that open it. Everything else measures coverage, which a
  # single-file bundle cannot give: its assemblies are loaded from inside the exe, where nothing can
  # instrument them. Same IL, different packaging - so the suites drive the ordinary build output and
  # these few drive the bundle.
  package:
    name: Publish, sign and open the bundle
    runs-on: windows-latest
    # id-token is what Azure login exchanges for signing credentials. A pull request run is handed the
    # same token; it is inert, because the federated credential accepts only master.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Signing switches itself off wherever it cannot work, so no fork has to care that it exists: a fork
      # has no signing variables, and the federated credential in Entra trusts only this repository on
      # master, so a token minted anywhere else buys nothing. A fork therefore gets an unsigned exe and a
      # green build. Restricting it to master also means "Run workflow" on master signs without releasing,
      # which is the way to rehearse a change to any of this before it is load-bearing.
      SIGN_RELEASE: ${{ vars.SIGNING_ACCOUNT_NAME != '' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare

      # CalVer: <year>.<month>.<run number>. Always increasing, never needs bumping by hand.
      # The offset carries the numbering past v2026.8.59, the last release made before the repository was
      # recreated to drop a rewritten history - that reset GITHUB_RUN_NUMBER to 1, and a version lower
      # than one already released would read as a downgrade to the updater and never install.
      - name: Compute version
        id: version
        run: |
          $now = [datetime]::UtcNow
          $version = "$($now.Year).$($now.Month).$([int]$env:GITHUB_RUN_NUMBER + 60)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      # One self-contained-looking file: the runtime is still shared (framework-dependent), but the app's
      # own assemblies and config are bundled into the exe so it can be copied around on its own.
      # DebugType=embedded keeps line numbers in the crash log without a .pdb sitting next to it.
      - name: Publish
        run: >
          dotnet publish src/Cascade.App/Cascade.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish -v q --nologo ${{ env.FAST_BUILD }}

      # The bundle checks below need the UI test assembly. It does not need the app's - it launches the
      # exe rather than referencing it - so the publish above is the only build of the app in this job.
      - name: Build the checks that open the bundle
        run: >
          dotnet build tests/Cascade.UiTests/Cascade.UiTests.csproj -c Release -v q --nologo
          -p:BuildProjectReferences=false ${{ env.FAST_BUILD }}

      - name: Verify publish stayed framework-dependent
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\Cascade.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Published executable was not found at $exe." }

          $thresholdBytes = 5MB
          $actualBytes = (Get-Item -LiteralPath $exe).Length
          Write-Host "Published Cascade.exe size: $actualBytes bytes (threshold: $thresholdBytes bytes)."

          if ($actualBytes -gt $thresholdBytes) {
            throw "Published Cascade.exe is $actualBytes bytes, over the 5 MB guardrail. The likely cause is the publish becoming self-contained: framework-dependent single-file output is around 1 MB and grows slowly with the code, while self-contained output is about 116 MB."
          }

      # Authenticode signing. SmartScreen accrues reputation to the signing certificate, not to each new
      # file hash, so a signed release inherits the standing of every release before it - where an unsigned
      # build, being a brand new hash on every push to master, always starts again from nothing.
      # Signed here rather than just before packaging so the bundle checks below drive the bytes that ship:
      # a signature changes the file, and an exe tested before signing is not the exe anybody downloads.
      - name: Azure login
        if: env.SIGN_RELEASE == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: env.SIGN_RELEASE == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\artifacts\publish\Cascade.exe
          file-digest: SHA256
          # Certificates now expire within 460 days, and a signature without a countersigned timestamp dies
          # with the certificate that made it - retroactively, taking every release already downloaded with
          # it. The timestamp is what proves the signing happened while the certificate was still valid.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cascade
          description-url: https://github.com/rahul-ramadas/Cascade

      # The signing step reports its own failures, but not a signature that applied and then does not hold
      # up - an untrusted chain, or the silent timestamp omission above. Windows is the authority on that,
      # so ask it here rather than discover it from a user's SmartScreen prompt.
      - name: Verify the signature
        if: env.SIGN_RELEASE == 'true'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\Cascade.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe

          if ($signature.Status -ne 'Valid') {
            throw "Cascade.exe did not come out validly signed. Status: $($signature.Status). $($signature.StatusMessage)"
          }

          if (-not $signature.TimeStamperCertificate) {
            throw "Cascade.exe is signed but not timestamped, so every signature made with this certificate stops verifying the day it expires. Check the timestamp-rfc3161 input on the signing step."
          }

          $signer = $signature.SignerCertificate
          Write-Host "Signer: $($signer.Subject)"
          Write-Host "Issuer: $($signer.Issuer)"
          Write-Host "Certificate valid until: $($signer.NotAfter.ToString('u'))"
          Write-Host "Timestamped by: $($signature.TimeStamperCertificate.Subject)"

          @(
            '### Authenticode signature'
            ''
            '| Item | Value |'
            '| --- | --- |'
            "| Status | ``$($signature.Status)`` |"
            "| Signer | ``$($signer.Subject)`` |"
            "| Certificate expires | ``$($signer.NotAfter.ToString('u'))`` |"
            "| Timestamped | ``yes`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # What the coverage-measured UI shards give up: nothing there has opened the bundle that ships.
      # These are the checks that would notice - every dialog and the main window built from it, the
      # automation stack, the command line.
      - name: The published exe really runs
        timeout-minutes: 10
        env:
          CASCADE_TEST_EXE: ${{ github.workspace }}\artifacts\publish\Cascade.exe
        run: >
          dotnet test tests/Cascade.UiTests/Cascade.UiTests.csproj
          -c Release --no-build -v q --nologo
          --logger "trx;LogFileName=exe.trx"
          --results-directory artifacts/test-results
          --filter "FullyQualifiedName~ScreenshotHarnessTests|FullyQualifiedName~FixtureSmoke|FullyQualifiedName~AutomationTests"

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Copy-Item artifacts/publish/Cascade.exe artifacts/package/Cascade.exe

      - uses: actions/upload-artifact@v7
        with:
          name: cascade-win-x64
          path: artifacts/package/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  # The engine. No window, no desktop, already parallel within a run - split in two because the coverage
  # collector roughly doubles what it costs, and a second runner takes that back.
  core:
    name: Core ${{ matrix.shard }}/2
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          coverage: true
          coverage-version: ${{ env.COVERAGE_TOOL_VERSION }}
      - run: dotnet build tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj -c Release -v q --nologo ${{ env.FAST_BUILD }}
      - name: Run the shard
        timeout-minutes: 10
        run: |
          $filter = ./scripts/Split-Tests.ps1 -Project tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj -Shard ${{ matrix.shard }} -Of 2 -By Class -ExpectedFile artifacts/test-results/core-${{ matrix.shard }}.expected
          $test = 'dotnet test tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj -c Release --no-build -v q --nologo' +
                  " --filter $filter" +
                  ' --logger trx;LogFileName=core-${{ matrix.shard }}.trx --results-directory artifacts/test-results'
          dotnet-coverage collect --settings tests/coverage.runsettings `
            --output artifacts/test-results/core-${{ matrix.shard }}.cobertura.xml --output-format cobertura $test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-results-core-${{ matrix.shard }}
          path: artifacts/test-results/*
          if-no-files-found: error

  # The WinForms half: real controls, dialogs and windows, built on a hidden STA thread in process. One
  # such thread per process by design - too much of what these look at is process-wide for two windows to
  # be driven at once - so the concurrency is bought here instead, one process per shard.
  app:
    name: App ${{ matrix.shard }}/4
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          coverage: true
          coverage-version: ${{ env.COVERAGE_TOOL_VERSION }}
      - run: dotnet build tests/Cascade.AppTests/Cascade.AppTests.csproj -c Release -v q --nologo ${{ env.FAST_BUILD }}
      - name: Run the shard
        timeout-minutes: 15
        run: |
          $filter = ./scripts/Split-Tests.ps1 -Project tests/Cascade.AppTests/Cascade.AppTests.csproj -Shard ${{ matrix.shard }} -Of 4 -By Method -ExpectedFile artifacts/test-results/app-${{ matrix.shard }}.expected
          $test = 'dotnet test tests/Cascade.AppTests/Cascade.AppTests.csproj -c Release --no-build -v q --nologo' +
                  " --filter $filter" +
                  ' --logger trx;LogFileName=app-${{ matrix.shard }}.trx --results-directory artifacts/test-results'
          dotnet-coverage collect --settings tests/coverage.runsettings `
            --output artifacts/test-results/app-${{ matrix.shard }}.cobertura.xml --output-format cobertura $test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-results-app-${{ matrix.shard }}
          path: artifacts/test-results/*
          if-no-files-found: error

  # The shipped executable, driven through UI Automation - one process launch per test, and a desktop each
  # test has to itself. Splitting these four ways is the whole reason the pipeline is a fan: they cannot be
  # made to overlap on one desktop (MEASURED: four threads went red every time), but four desktops is four
  # times the speed for nothing.
  # Drives the build output rather than the published bundle, and only because coverage demands it - see
  # the package job, which opens the bundle.
  ui:
    name: UI ${{ matrix.shard }}/6
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          coverage: true
          coverage-version: ${{ env.COVERAGE_TOOL_VERSION }}
      - run: dotnet build tests/Cascade.UiTests/Cascade.UiTests.csproj -c Release -v q --nologo ${{ env.FAST_BUILD }}
      - name: Run the shard
        timeout-minutes: 15
        env:
          CASCADE_TEST_EXE: ${{ github.workspace }}\src\Cascade.App\bin\Release\net10.0-windows\Cascade.exe
        run: |
          $filter = ./scripts/Split-Tests.ps1 -Project tests/Cascade.UiTests/Cascade.UiTests.csproj -Shard ${{ matrix.shard }} -Of 6 -By Method -ExpectedFile artifacts/test-results/ui-${{ matrix.shard }}.expected
          $test = 'dotnet test tests/Cascade.UiTests/Cascade.UiTests.csproj -c Release --no-build -v q --nologo' +
                  " --filter $filter" +
                  ' --logger trx;LogFileName=ui-${{ matrix.shard }}.trx --results-directory artifacts/test-results'
          dotnet-coverage collect --settings tests/coverage.runsettings `
            --output artifacts/test-results/ui-${{ matrix.shard }}.cobertura.xml --output-format cobertura $test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-results-ui-${{ matrix.shard }}
          path: artifacts/test-results/*
          if-no-files-found: error

  # Everything the shards produced, put back together: the coverage floor, and the tally that proves the
  # split did not quietly leave tests unrun. Also the one artifact anybody downloads to read a failure, so
  # `gh run download <id> -n test-results` still means what it used to.
  gate:
    name: Coverage and tallies
    # Nothing here builds or runs a Windows binary - it reads XML - and a Linux runner starts and checks
    # out in a third of the time, which is worth having on the last job before the release.
    runs-on: ubuntu-latest
    # Deliberately NOT waiting for the package job. It signs, which takes half a minute nothing here needs,
    # and putting it in front of this would put it in front of the release as well.
    needs: [core, app, ui]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: suite-results-*
          merge-multiple: true
          path: artifacts/test-results

      - name: Every shard ran what it discovered
        run: ./scripts/Check-Shards.ps1 -ResultsDirectory artifacts/test-results

      # Coverage is reported, and a floor is enforced, because a number nobody looks at is not a measure of
      # anything. The floor sits three points under what the suites reach today (93.0%): it is there to
      # catch a body of new code arriving untested, not to be ratcheted up for its own sake - a number
      # chased for its own reward buys tests written to touch lines rather than to state properties.
      - name: Coverage
        run: ./scripts/Report-Coverage.ps1 -ResultsDirectory artifacts/test-results -MinimumLineRate 90 -MinimumLines 13000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.cobertura.xml
          if-no-files-found: ignore

  release:
    name: Release
    needs: [strict, package, gate]
    # Only a green build of master ships; pull requests and manual runs stop at the artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cascade-win-x64
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The asset keeps a fixed name so that
        # https://github.com/<owner>/<repo>/releases/latest/download/Cascade.exe always fetches the newest
        # build - that URL needs the exact filename, so a version in it means no fixed download command can
        # ever exist. The version is in the tag, the release title, and the executable's own metadata.
        run: |
          gh release create "v$VERSION" dist/Cascade.exe \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Cascade v$VERSION" \
            --generate-notes

      # Every green push to master ships a release, so the release list and the tag namespace grow without
      # bound - 33 had piled up before the first sweep. Keeping the newest few leaves room to roll back to a
      # recent known-good exe without hoarding builds nobody would install any more.
      # Ordering is by publish time, not created_at: GitHub reports the target commit's own timestamp as a
      # release's created_at, so a rewritten history or an out-of-order commit date would scramble that sort
      # and prune the wrong builds.
      # A release and its tag are separate objects, and deleting the release alone would strand the tag,
      # so --cleanup-tag takes both. Drafts are skipped because a draft has no tag to clean up.
      # Failure here is deliberately fatal: the release itself is already published by this point, and a red
      # run is the only thing that would surface pruning silently breaking and letting releases pile up.
      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: 5
        run: |
          stale=$(gh release list --repo "$REPO" --limit 200 \
            --json tagName,publishedAt,isDraft \
            --jq "[.[] | select(.isDraft | not)] | sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName")

          if [ -z "$stale" ]; then
            echo "Nothing to prune: $KEEP or fewer releases exist."
            exit 0
          fi

          while read -r tag; do
            echo "Deleting release $tag and its tag."
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done <<< "$stale"
