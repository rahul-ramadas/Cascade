name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless, but never cancel a master run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CalVer: <year>.<month>.<run number>. Always increasing, never needs bumping by hand.
      - name: Compute version
        id: version
        run: |
          $now = [datetime]::UtcNow
          $version = "$($now.Year).$($now.Month).$($env:GITHUB_RUN_NUMBER)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore Cascade.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Cascade.slnx -c Release --no-restore -p:Version=$env:VERSION

      - name: Core tests
        run: >
          dotnet test tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core.trx"
          --results-directory artifacts/test-results

      # These drive the real Cascade.exe through UI Automation, so they need the runner's desktop
      # session. Capped so a hung window cannot burn the whole job's time budget.
      - name: UI tests
        timeout-minutes: 15
        run: >
          dotnet test tests/Cascade.UiTests/Cascade.UiTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=ui.trx"
          --results-directory artifacts/test-results

      # One self-contained-looking file: the runtime is still shared (framework-dependent), but the app's
      # own assemblies and config are bundled into the exe so it can be copied around on its own.
      # DebugType=embedded keeps line numbers in the crash log without a .pdb sitting next to it.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/Cascade.App/Cascade.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -p:Version=$env:VERSION
          -o artifacts/publish

      # Everything above tests the multi-file build output in bin/. This is the only step that runs the
      # artifact we actually ship, which is a different layout: assemblies and config are bundled inside
      # the exe. --selftest covers the engine and settings; --screens builds every dialog and the main
      # window, so it proves the embedded icon and resources still resolve out of the bundle.
      # Cascade.exe is a GUI-subsystem binary, so PowerShell does NOT wait for it and $LASTEXITCODE would
      # be meaningless - Start-Process -Wait -PassThru is required.
      - name: Smoke-test the published exe
        run: |
          $exe = (Resolve-Path artifacts/publish/Cascade.exe).Path
          $shots = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          foreach ($run in @(@('--selftest'), @('--screens', $shots))) {
            $p = Start-Process $exe -ArgumentList $run -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content (Join-Path $env:TEMP 'cascade_selftest.log') -ErrorAction SilentlyContinue
              throw "Published Cascade.exe failed '$($run -join ' ')' with exit code $($p.ExitCode)."
            }
          }
          if (-not (Test-Path (Join-Path $shots 'main.png'))) { throw "The published exe rendered no main window." }

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Copy-Item artifacts/publish/Cascade.exe "artifacts/package/Cascade-$env:VERSION-win-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-win-x64
          path: artifacts/package/*.exe
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    # Only a green build of master ships; pull requests and manual runs stop at the artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cascade-win-x64
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" dist/*.exe \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Cascade v$VERSION" \
            --generate-notes
