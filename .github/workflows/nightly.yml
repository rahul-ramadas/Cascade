name: Nightly

# What a push cannot afford: the same tests run until they mean something.
#
# Everything here is chosen because it has a real chance of catching something the push build cannot,
# and nothing is here to look thorough. Five kinds of thing:
#
#   * REPEATS. A test that asserts on a wall clock, or races a worker against the thread watching it, sits
#     green for weeks and then fails on a busy runner. The way to find one is to run the suite until it
#     shows, under the CPU load a hosted runner is actually under. That is how the one flake this repo had
#     was found, and it had been green in every summary for months.
#   * SCALE. Whole mechanisms only exist above a certain size: the line index pages at 65,536 lines, a
#     filter pass over four thousand lines finishes before anything can watch it stream, and the match
#     cache's word alignment only matters when indexing has not finished before filtering starts. Each of
#     those has carried a real bug that no second-long test could have reached.
#   * FUZZ WITH ROOM. The differential tests compare three independent implementations - an automaton, a
#     rewriter and a plain walk - and with a fixed seed they explore exactly the same ground every time.
#     Scaled up, and seeded differently, they spend real time looking somewhere new.
#   * DATA NOBODY CHOSE. Every fixture in this repository was written to be tested, which means every one
#     of them agrees with whatever the author assumed a log looks like. A runner keeps real Windows logs
#     on it; running the engine over one holds it against data with no such agreement.
#   * A REAL MOUSE AND KEYBOARD. Every other suite drives the app through UI Automation or by posting
#     messages, deliberately, so that a developer can keep working while they run. That means none of them
#     is a person using the application, and the sweep that is has found four faults they all missed.
#
# A failure here is worth a look but does not block anybody: nothing has been pushed, and the point is to
# learn something before a user does.

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC, i.e. overnight for the author
  workflow_dispatch:
    inputs:
      repeats:
        description: How many times to run each suite when hunting flakes
        default: '10'
      soakLines:
        description: Lines in the generated log the engine soak runs over
        default: '8000000'
      fuzzScale:
        description: Multiplier for the random tests
        default: '25'
      proveTheHangDump:
        description: Wedge a run on purpose first, to check the hang machinery still works
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REPEATS: ${{ inputs.repeats || '10' }}
  SOAK_LINES: ${{ inputs.soakLines || '8000000' }}
  FUZZ_SCALE: ${{ inputs.fuzzScale || '25' }}

jobs:
  soak:
    name: Scale and fuzz
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Check whether global.json SDK is already available
        id: sdk
        run: |
          $ErrorActionPreference = 'Continue'
          $null = & dotnet --version 2>&1
          $found = ($LASTEXITCODE -eq 0)
          "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.found != 'True'
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Cascade.slnx -c Release

      # A step that wedges on a runner leaves nothing behind: Actions kills the job at its cap and the log
      # stops mid-sentence. That happened here - a fuzz run that takes twenty-three seconds took EIGHTY-EIGHT
      # MINUTES, was cancelled, and took the three steps behind it with it. Nothing could be said about it
      # afterwards beyond "it did not finish", so nothing was.
      #
      # Every long step below now runs under scripts/Invoke-WithHangDump.ps1, which photographs the whole
      # process tree - managed stacks into the log, a dump beside them - and kills it, well before the step's
      # own timeout-minutes, which Actions enforces without asking anybody.
      #
      # The machinery is only worth having if it still works, and nothing else here would notice if it
      # stopped. This step is how to find out, on the runner rather than on a desk: it cuts a run short on
      # purpose and passes only if the stacks and the dump really arrived, and only if the stacks name
      # Cascade's own frames - which is the difference between a dump and a diagnosis.
      #
      # The app checks are what it wedges, because they take a minute or so on any machine: pointing this at
      # a suite that finishes in under fifteen seconds somewhere would make it fail for the wrong reason.
      - name: Prove the hang machinery still bites
        if: inputs.proveTheHangDump
        timeout-minutes: 10
        run: |
          $stuck = 'artifacts/stuck'
          ./scripts/Invoke-WithHangDump.ps1 -Name proof -TimeoutMinutes 0.25 -ReportDirectory $stuck `
            -- dotnet test tests/Cascade.AppTests/Cascade.AppTests.csproj -c Release --no-build --nologo
          $code = $LASTEXITCODE

          if ($code -ne 124) { throw "The watchdog let a wedged run through: it exited $code, not 124." }

          $stacks = @(Get-ChildItem -Path $stuck -Filter '*-stacks.txt' -ErrorAction SilentlyContinue)
          $named = @($stacks | Where-Object { Select-String -LiteralPath $_.FullName -Pattern 'Cascade\.' -Quiet })
          $dumps = @(Get-ChildItem -Path $stuck -Filter '*.dmp' -ErrorAction SilentlyContinue |
                     Where-Object { $_.Length -gt 0 })

          Write-Host "$($stacks.Count) stack file(s), $($named.Count) of them naming Cascade frames, $($dumps.Count) dump(s)."
          if ($named.Count -eq 0) { throw 'No captured stack named a Cascade frame; a wedge here would still be undiagnosable.' }
          if ($dumps.Count -eq 0) { throw 'No dump was written.' }
          Remove-Item -Path $stuck -Recurse -Force

          # This step made something fail on purpose, so it ends holding the watchdog's own exit code -
          # and Actions ends every pwsh step with `exit $LASTEXITCODE`, which would fail the step for
          # doing exactly what it was asked to do. Say so explicitly.
          Write-Host 'The hang machinery still bites.'
          exit 0

      # The engine over a log big enough to page the index, stream a filter pass, and make the match cache
      # be built from partial information. Answers are compared against the generator's own arithmetic, so
      # nothing here is a snapshot of what the engine happened to say last time.
      # Every step from here to the end of the job is independent of the ones before it, and each has a
      # timeout of its own - so none of them may be skipped because an earlier one went red. That is the
      # same rule as the timeouts, stated for failure rather than for time: the real-file checks below had
      # never run once on CI, because whatever came before them always used the budget up first.
      - name: Engine soak on a generated multi-hundred-megabyte log
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          CASCADE_SOAK: '1'
          CASCADE_SOAK_LINES: ${{ env.SOAK_LINES }}
        run: >
          ./scripts/Invoke-WithHangDump.ps1 -Name soak -TimeoutMinutes 15 -ReportDirectory artifacts/stuck
          -- dotnet test tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj
          -c Release --no-build --filter "FullyQualifiedName~SoakTests"
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=soak.trx" --results-directory artifacts/nightly

      # The same differential tests the push build runs, given room to explore. The seed moves with the
      # scale, so this is new ground rather than a longer walk down the same road; a failure prints the
      # seed, and setting CASCADE_FUZZ_SCALE to the same value reproduces it exactly.
      #
      # --blame-hang is the other half of the watchdog and answers a question it cannot: which TEST stopped
      # coming back. It arms inside the test host, so it says nothing when the wedge is anywhere else - and
      # the watchdog says nothing about which test was running. Between them there is no silent case left.
      - name: Fuzz the engine harder
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          CASCADE_FUZZ_SCALE: ${{ env.FUZZ_SCALE }}
        run: >
          ./scripts/Invoke-WithHangDump.ps1 -Name fuzz -TimeoutMinutes 22 -ReportDirectory artifacts/stuck
          -- dotnet test tests/Cascade.Core.Tests/Cascade.Core.Tests.csproj
          -c Release --no-build
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=fuzz.trx" --results-directory artifacts/nightly

      # A log nobody wrote to be tested. The soak above proves the answers are right, but it can only do
      # that because its own contents are arithmetic - so between them the two say nothing about a file
      # whose shape was not chosen. Windows keeps several real logs on every runner: servicing, DISM,
      # setup. They are messy in the ways that matter here - long lines, mixed encodings, CRLF, blank
      # lines, embedded payloads - and they cost nothing to obtain.
      #
      # The hunting is done here rather than in the test so the test stays something that takes a path.
      # A persisted log is preferred over a live one: CBS.log is being written as this runs, and the
      # checks compare the engine against an independent read of the same bytes, which a file changing
      # underneath would break for a reason that is nothing to do with Cascade.
      - name: Find a real log on the runner
        id: log
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          $roots = @('C:\Windows\Logs', 'C:\Windows\Panther', "$env:SystemRoot\Logs")
          $live = @('CBS.log', 'WindowsUpdate.log')
          $found = Get-ChildItem -Path $roots -Filter *.log -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.Length -gt 256KB -and $live -notcontains $_.Name } |
                   Sort-Object Length -Descending |
                   Select-Object -First 1

          if (-not $found) {
            # Not fatal: this is opportunistic, and a runner image that stops shipping logs must not fail
            # a nightly over it. The step below reports SKIPPED, which is visible, rather than passing.
            Write-Host 'No real log over 256 KB was found; the real-file checks will report skipped.'
            'path=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Write-Host "Using $($found.FullName) ($('{0:N0}' -f $found.Length) bytes)."
          "path=$($found.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Copied first, and read-only: the engine memory-maps what it opens, and a servicing log the OS
      # decides to roll over mid-run would take the mapping with it.
      #
      # The copy goes beside the results rather than among them: the results are uploaded whole, and a
      # runner's largest log is not something anybody wants to download to read a trx.
      - name: The engine over a log nobody wrote for it
        if: ${{ !cancelled() && steps.log.outputs.path != '' }}
        timeout-minutes: 20
        env:
          CASCADE_BIG_FILE: ${{ github.workspace }}\artifacts\reallog\real.log
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nightly, artifacts/reallog | Out-Null
          Copy-Item -LiteralPath '${{ steps.log.outputs.path }}' -Destination $env:CASCADE_BIG_FILE -Force
          ./scripts/Invoke-WithHangDump.ps1 -Name realfile -TimeoutMinutes 12 -ReportDirectory artifacts/stuck `
            -- dotnet test tests/Cascade.AppTests/Cascade.AppTests.csproj `
               -c Release --no-build --filter 'FullyQualifiedName~RealFileTests' `
               --blame-hang --blame-hang-timeout 8m --blame-hang-dump-type mini `
               --logger 'trx;LogFileName=realfile.trx' --results-directory artifacts/nightly

      # A skipped result here means the checks did not run, and that is the state this step exists to make
      # visible - it was invisible for as long as the test reported a pass instead.
      - name: Say whether the real-file checks actually ran
        if: always()
        run: |
          $trx = Join-Path $env:GITHUB_WORKSPACE 'artifacts\nightly\realfile.trx'
          if (-not (Test-Path -LiteralPath $trx)) {
            Write-Host 'The real-file checks did not run: no log was found on this runner.'
            exit 0
          }

          [xml] $results = Get-Content -LiteralPath $trx
          foreach ($result in @($results.TestRun.Results.UnitTestResult)) {
            if ($result) { Write-Host "$($result.outcome): $($result.testName)" }
          }

      # Everything under artifacts/nightly, not just the trx files: --blame writes its sequence file and any
      # hang dump into the results directory, and those are the whole point of asking for them.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-soak
          path: |
            artifacts/nightly/**
            artifacts/stuck/**
          if-no-files-found: ignore

  flakes:
    name: Repeat the suites under load
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Check whether global.json SDK is already available
        id: sdk
        run: |
          $ErrorActionPreference = 'Continue'
          $null = & dotnet --version 2>&1
          $found = ($LASTEXITCODE -eq 0)
          "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.found != 'True'
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Cascade.slnx -c Release

      - name: Publish
        run: >
          dotnet publish src/Cascade.App/Cascade.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -o artifacts/publish

      # Burners alongside, because a quiet machine is not the condition these fail under. The engine suite
      # is the one worth loading up: it is where the concurrency lives, and it is cheap enough to repeat.
      #
      # The script caps the burners at half the machine, and it has to: this asked for 8 on a runner with
      # four cores, which is two per core, and the suite - ten seconds unloaded - had not finished ONE of
      # its ten repeats when the job hit its two-hour limit. The steps below were skipped, so a load figure
      # chosen on a 32-thread desktop cost the whole nightly, every night, silently.
      #
      # Every step here is capped as well, for the same reason: one that will not finish must lose its own
      # time and not the rest of the job's.
      - name: Repeat the engine suite under CPU load
        timeout-minutes: 30
        run: >
          pwsh -NoProfile -File scripts/Find-FlakyTests.ps1
          -Suite core -Runs $env:REPEATS -Load 8 -TimeoutMinutes 12
          -ResultsDirectory artifacts/nightly-core

      - name: Repeat the app checks
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: >
          pwsh -NoProfile -File scripts/Find-FlakyTests.ps1
          -Suite app -Runs $env:REPEATS -TimeoutMinutes 15
          -ResultsDirectory artifacts/nightly-app

      # Fewer repeats: every one of these launches the real executable, and the desktop is shared, so this
      # is the slowest thing here by a wide margin. Three runs is still three chances to catch a wait that
      # is one tick too short.
      #
      # The hang watchdog is armed at a second, which turns this into a soak of its own: a stall of more
      # than a second anywhere in the app - a repaint, a filter change, closing a dialog - leaves a dump
      # and a report behind, and the step after this refuses to pass if any were written. MEASURED at two
      # seconds over a whole suite run: 53 watchdogs armed, 0 hangs, 39 of 39 green.
      - name: Repeat the UI suite, watching for stalls
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        env:
          CASCADE_TEST_EXE: ${{ github.workspace }}\artifacts\publish\Cascade.exe
          CASCADE_HANG_WATCHDOG: '1'
          CASCADE_HANG_SECONDS: '2'
          CASCADE_HANG_DIR: ${{ github.workspace }}\artifacts\hangs
        run: >
          pwsh -NoProfile -File scripts/Find-FlakyTests.ps1
          -Suite ui -Runs 3 -TimeoutMinutes 20
          -ResultsDirectory artifacts/nightly-ui

      - name: Report any stall the watchdog recorded
        if: always()
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\hangs'
          $reports = @(Get-ChildItem -Path $dir -Filter '*.txt' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host 'No stall was recorded: the window answered within a second throughout.'
            exit 0
          }

          foreach ($report in $reports) {
            Write-Host "=== $($report.Name) ==="
            Get-Content -LiteralPath $report.FullName | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
          }
          throw "$($reports.Count) stall(s) of over a second were recorded. The dumps are in the nightly-hangs artifact."

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-repeats
          path: |
            artifacts/nightly-core/**
            artifacts/nightly-app/**
            artifacts/nightly-ui/**
          if-no-files-found: ignore

      - name: Upload any hang dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-hangs
          path: artifacts/hangs/*
          if-no-files-found: ignore

  sweep:
    name: Drive the app by hand
    runs-on: windows-latest
    timeout-minutes: 45

    # Its own job rather than a step on the end of another. It wants the desktop to itself - a real pointer
    # and real keystrokes go wherever the foreground is - and putting it last in a job means it is the thing
    # that gets skipped when everything before it has eaten the budget, which is how the whole nightly was
    # lost once already.
    steps:
      - uses: actions/checkout@v7

      - name: Check whether global.json SDK is already available
        id: sdk
        run: |
          $ErrorActionPreference = 'Continue'
          $null = & dotnet --version 2>&1
          $found = ($LASTEXITCODE -eq 0)
          "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.sdk.outputs.found != 'True'
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Cascade.slnx -c Release

      - name: Publish
        run: >
          dotnet publish src/Cascade.App/Cascade.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -o artifacts/publish

      # Nineteen stages over a generated 4M-line log, driving the real pointer and real keys, and the only
      # thing anywhere that uses the application the way a person does. It found four faults the automated
      # suites missed, and its failure mode is ROT rather than flake: it drifted to seventeen findings on a
      # clean tree over forty-four commits with nobody the wiser, because nothing ran it. Running it is the
      # cure for that, and a runner is a BETTER place for it than a desk - the stray click that poisons a
      # stage, and every stage after it, cannot happen where nobody is sitting.
      #
      # CASCADE_TEST_OFFSCREEN is deliberately not set: a real pointer cannot reach a window parked past the
      # last monitor. That is also why this cannot join the UI repeats above, which do set it.
      #
      # Maximised on a runner is 1024x768, less than half the room the rig was written on. Rehearsed at that
      # geometry before this was wired up (CASCADE_MANUAL_SIZE takes device pixels, so 1536x1152 is the same
      # room on a 150% display): 100 checks pass and one finding stands, which is the minimap not answering
      # a drag at that size. Expect this job to report that until it is settled.
      # A rig driving a real pointer has a failure mode the others do not: a modal dialog nobody dismissed,
      # or a menu that never opened, and it simply waits. The watchdog walks the whole tree, so what it
      # photographs includes Cascade.exe itself - which is the process whose stacks answer that question.
      - name: Sweep the app with a real mouse and keyboard
        timeout-minutes: 25
        env:
          CASCADE_MANUAL: '1'
          CASCADE_TEST_EXE: ${{ github.workspace }}\artifacts\publish\Cascade.exe
          CASCADE_MANUAL_OUT: ${{ github.workspace }}\artifacts\sweep
        run: >
          ./scripts/Invoke-WithHangDump.ps1 -Name sweep -TimeoutMinutes 18 -ReportDirectory artifacts/sweep/stuck
          -- dotnet test tests/Cascade.UiTests/Cascade.UiTests.csproj
          -c Release --no-build --filter "FullyQualifiedName~ManualSweep"
          --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type mini
          --logger "trx;LogFileName=sweep.trx" --results-directory artifacts/sweep

      # The findings are the product, so they have to be readable without downloading anything - and the
      # SHAPE of them is half the diagnosis. Findings bunched in the last few stages mean one of them left a
      # dialog standing and everything after it did nothing, which is a different thing from findings spread
      # about.
      - name: Report what the sweep found
        if: always()
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'artifacts\sweep\log.txt'
          if (-not (Test-Path -LiteralPath $log)) {
            Write-Host 'The sweep wrote no log; it did not get as far as running.'
            exit 0
          }

          $lines = Get-Content -LiteralPath $log
          $ok = @($lines | Where-Object { $_ -like 'ok  *' }).Count
          $bad = @($lines | Where-Object { $_ -like 'BAD *' }).Count

          $summary = @(
            '### Sweeping the app by hand'
            ''
            "**$ok** checks passed, **$bad** did not."
            ''
          )

          if ($bad -gt 0) {
            $summary += @('| Stage | Finding |', '| --- | --- |')
            $stage = '(before any stage)'
            foreach ($line in $lines) {
              if ($line -match '^=====\s*(.+?)\s*=====$') { $stage = $Matches[1] }
              elseif ($line -like 'BAD *') { $summary += "| $stage | $($line.Substring(4).Trim()) |" }
            }
            $summary += @('', 'Screenshots of every stage are in the nightly-sweep artifact.')
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $summary | ForEach-Object { Write-Host $_ }

      - name: Upload the sweep's log and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-sweep
          path: artifacts/sweep/**
          if-no-files-found: ignore
